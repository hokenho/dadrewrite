<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAD - Signer Authorization</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/sql-js/sql-wasm.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Disbursement Authorization Database <span class="subtitle">– Signer Authorization</span></h1>
        </div>

        <!-- Action Bar -->
        <div class="action-bar action-bar--blue">
            <span class="action-bar-label">Actions:</span>
            <button onclick="location.reload()">Refresh</button>
            <button onclick="doExport()">Export</button>
            <button onclick="window.print()">Print</button>
        </div>

        <!-- Search Panel -->
        <div class="panel panel--blue">
            <div class="panel-title">Search Filters</div>
            <div class="filter-grid">
                <div class="filter-field">
                    <label for="gadId">GAD ID</label>
                    <input type="text" id="gadId" placeholder="e.g. user@domain.com">
                </div>
                <div class="filter-field">
                    <label for="empNo">Employee No.</label>
                    <input type="number" id="empNo" placeholder="e.g. 10001">
                </div>
                <div class="filter-field">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="First name">
                </div>
                <div class="filter-field">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Last name">
                </div>
                <div class="filter-field">
                    <label for="bu">Business Unit</label>
                    <select id="bu">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="currency">Currency</label>
                    <select id="currency">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="limitAmt">Limit Amounts</label>
                    <input type="number" id="limitAmt" placeholder="e.g. 50000">
                </div>
                <div class="filter-field">
                    <label for="costCentre">Approval Cost Centre</label>
                    <select id="costCentre">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="policyCategory">Policy Category</label>
                    <select id="policyCategory">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="system">System</label>
                    <select id="system">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="chequePickUp">Cheque Pick Up</label>
                    <select id="chequePickUp">
                        <option value="">All</option>
                        <option>Y</option>
                        <option>N</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="exception">Exception</label>
                    <select id="exception">
                        <option value="">All</option>
                        <option>Y</option>
                        <option>N</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="tempDelegation">Temporary Delegation</label>
                    <input type="date" id="tempDelegation">
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="doSearch()">Search</button>
                <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
            </div>
        </div>

        <!-- Results Table -->
        <div class="panel panel--blue">
            <div class="panel-title">Results</div>
            <div class="data-table-wrapper">
                <table class="data-table" id="resultsTable">
                    <thead>
                        <tr>
                            <th>GAD ID</th>
                            <th>Status</th>
                            <th>Employee No.</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Business Unit</th>
                            <th>Currency</th>
                            <th>Limit Amounts</th>
                            <th>Approval Cost Centre</th>
                            <th>Policy Category</th>
                            <th>System</th>
                            <th>Cheque Pick Up</th>
                            <th>Exception</th>
                            <th>Temporary Delegation</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        var DB;
        var ALL_ROWS = [];

        (async function() {
            var SQL = await initSqlJs({ locateFile: function(f) { return 'js/sql-js/' + f; } });
            var buf = await fetch('db/data.db').then(function(r) { return r.arrayBuffer(); });
            DB = new SQL.Database(new Uint8Array(buf));

            function populateSelect(id, sql) {
                var sel = document.getElementById(id);
                var r = DB.exec(sql);
                if (r.length) r[0].values.forEach(function(v) {
                    var o = document.createElement('option');
                    o.textContent = o.value = v[0];
                    sel.appendChild(o);
                });
            }
            populateSelect('bu', 'SELECT DISTINCT name FROM business_unit ORDER BY name');
            populateSelect('currency', 'SELECT DISTINCT currency FROM currency ORDER BY currency');
            populateSelect('costCentre', 'SELECT DISTINCT cc FROM cost_center ORDER BY cc');
            populateSelect('policyCategory', 'SELECT DISTINCT category FROM policy ORDER BY category');
            populateSelect('system', 'SELECT DISTINCT system FROM policy ORDER BY system');

            var res = DB.exec(
                "SELECT s.gad_id, s.status, s.pickup_cheque, s.expire_date, " +
                "u.employee_id, u.first_name, u.last_name, " +
                "b.name AS bu_name, " +
                "sl.limit_amount, sl.currency, sl.exception, sl.approval_cc_id, sl.policy_id, " +
                "p.category, p.system, " +
                "cc.cc " +
                "FROM signer s " +
                "LEFT JOIN user_profile u ON s.gad_id = u.gad_id " +
                "LEFT JOIN business_unit b ON s.bu_id = b.id " +
                "LEFT JOIN signer_limit sl ON s.limit_id = sl.id " +
                "LEFT JOIN policy p ON sl.policy_id = p.id " +
                "LEFT JOIN cost_center cc ON sl.approval_cc_id = cc.id " +
                "ORDER BY u.last_name, u.first_name"
            );

            if (res.length) {
                ALL_ROWS = res[0].values.map(function(r) {
                    return {
                        gadId: r[0] || '', status: r[1], pickupCheque: r[2],
                        expireDate: r[3] || '', employeeId: r[4] || '',
                        firstName: r[5] || '', lastName: r[6] || '',
                        buName: r[7] || '', limitAmount: r[8],
                        currency: r[9] || '', exception: r[10],
                        cc: r[15] || '', category: r[13] || '', system: r[14] || ''
                    };
                });
            }
            renderRows(ALL_ROWS);
        })();

        function renderRows(rows) {
            var tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            var statusColors = { 1: '#2e7d32', 0: '#c62828' };
            var statusLabels = { 1: 'Active', 0: 'Inactive' };
            rows.forEach(function(r) {
                var tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                tr.onclick = function() { window.location = 'signer_details.html?upn=' + encodeURIComponent(r.gadId); };
                var amt = r.limitAmount != null ? Number(r.limitAmount).toLocaleString() : '';
                tr.innerHTML =
                    '<td>' + r.gadId + '</td>' +
                    '<td><span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.75rem;color:#fff;background:' + (statusColors[r.status] || '#757575') + ';">' + (statusLabels[r.status] || '') + '</span></td>' +
                    '<td>' + r.employeeId + '</td>' +
                    '<td>' + r.firstName + '</td>' +
                    '<td>' + r.lastName + '</td>' +
                    '<td>' + r.buName + '</td>' +
                    '<td>' + r.currency + '</td>' +
                    '<td>' + amt + '</td>' +
                    '<td>' + r.cc + '</td>' +
                    '<td>' + r.category + '</td>' +
                    '<td>' + r.system + '</td>' +
                    '<td class="text-center">' + (r.pickupCheque ? 'Y' : 'N') + '</td>' +
                    '<td class="text-center">' + (r.exception ? 'Y' : 'N') + '</td>' +
                    '<td>' + (r.expireDate || '—') + '</td>';
                tbody.appendChild(tr);
            });
        }

        // Map filter element IDs to result table column indices (0-based)
        var FILTER_COL_MAP = {
            gadId: 0, empNo: 2, firstName: 3, lastName: 4, bu: 5,
            currency: 6, limitAmt: 7, costCentre: 8, policyCategory: 9,
            system: 10, chequePickUp: 11, exception: 12, tempDelegation: 13
        };

        function highlightColumns() {
            // Clear previous highlights
            document.querySelectorAll('#resultsTable th, #resultsTable td').forEach(function(cell) {
                cell.style.backgroundColor = '';
            });
            // Highlight columns for active filters
            Object.keys(FILTER_COL_MAP).forEach(function(id) {
                var el = document.getElementById(id);
                if (!el || !el.value) return;
                var col = FILTER_COL_MAP[id];
                document.querySelectorAll('#resultsTable thead th')[col].style.backgroundColor = '#c8e6c9';
                document.querySelectorAll('#resultsTable tbody tr').forEach(function(tr) {
                    var td = tr.children[col];
                    if (td) td.style.backgroundColor = '#e8f5e9';
                });
            });
        }

        function doSearch() {
            var gadIdVal = document.getElementById('gadId').value.trim().toLowerCase();
            var empNo = document.getElementById('empNo').value.trim();
            var firstName = document.getElementById('firstName').value.trim().toLowerCase();
            var lastName = document.getElementById('lastName').value.trim().toLowerCase();
            var bu = document.getElementById('bu').value;
            var cur = document.getElementById('currency').value;
            var limitAmt = document.getElementById('limitAmt').value.trim();
            var cc = document.getElementById('costCentre').value;
            var cat = document.getElementById('policyCategory').value;
            var sys = document.getElementById('system').value;
            var chq = document.getElementById('chequePickUp').value;
            var exc = document.getElementById('exception').value;
            var temp = document.getElementById('tempDelegation').value;

            var filtered = ALL_ROWS.filter(function(r) {
                if (gadIdVal && r.gadId.toLowerCase().indexOf(gadIdVal) === -1) return false;
                if (empNo && String(r.employeeId) !== empNo) return false;
                if (firstName && r.firstName.toLowerCase().indexOf(firstName) === -1) return false;
                if (lastName && r.lastName.toLowerCase().indexOf(lastName) === -1) return false;
                if (bu && r.buName !== bu) return false;
                if (cur && r.currency !== cur) return false;
                if (limitAmt && r.limitAmount != Number(limitAmt)) return false;
                if (cc && r.cc !== cc) return false;
                if (cat && r.category !== cat) return false;
                if (sys && r.system !== sys) return false;
                if (chq && (r.pickupCheque ? 'Y' : 'N') !== chq) return false;
                if (exc && (r.exception ? 'Y' : 'N') !== exc) return false;
                if (temp && r.expireDate !== temp) return false;
                return true;
            });
            renderRows(filtered);
            highlightColumns();
        }

        function doExport() {
            alert('Export triggered – connect to backend to generate file.');
        }

        function clearFilters() {
            document.querySelectorAll('.filter-field input, .filter-field select').forEach(function(el) {
                el.value = '';
            });
            document.querySelectorAll('#resultsTable th, #resultsTable td').forEach(function(cell) {
                cell.style.backgroundColor = '';
            });
            renderRows(ALL_ROWS);
        }

        document.querySelectorAll('.filter-field input, .filter-field select').forEach(function(el) {
            el.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
        });
    </script>
    <script src="js/navbar.js"></script>
</body>
</html>
