<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAD - Request New Signer Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Disbursement Authorization Database <span class="subtitle">– Signer Onboarding</span></h1>
        </div>

        <script src="js/navbar.js"></script>

        <!-- Section 1: Search Form -->
        <div class="panel panel--blue">
            <div class="panel-title">Section 1: Search Signer</div>
            <div class="filter-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                <div class="filter-field">
                    <label for="gadId">GAD ID</label>
                    <input type="text" id="gadId" placeholder="e.g. john.smith@manulife.com">
                </div>
                <div class="filter-field">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="First name">
                </div>
                <div class="filter-field">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Last name">
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="doSearch()">Search</button>
                <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
            </div>
        </div>

        <!-- Section 2: Results Table -->
        <div class="panel panel--blue">
            <div class="panel-title">Section 2: Results</div>
            <p style="margin: 0 0 15px 0; font-style: italic; color: #555;">Click the row to request change</p>
            <div class="data-table-wrapper">
                <table class="data-table" id="resultsTable">
                    <thead>
                        <tr>
                            <th>GAD ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Existing Signer</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <tr onclick="handleRowClick('Y', 'john.smith@manulife.com')" style="cursor: pointer;">
                            <td>john.smith@manulife.com</td>
                            <td>John</td>
                            <td>Smith</td>
                            <td>Y</td>
                        </tr>
                        <tr onclick="handleRowClick('N', 'jane.doe@manulife.com')" style="cursor: pointer;">
                            <td>jane.doe@manulife.com</td>
                            <td>Jane</td>
                            <td>Doe</td>
                            <td>N</td>
                        </tr>
                        <tr onclick="handleRowClick('Y', 'wei.chan@manulife.com')" style="cursor: pointer;">
                            <td>wei.chan@manulife.com</td>
                            <td>Wei</td>
                            <td>Chan</td>
                            <td>Y</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function doSearch() {
            alert('Search triggered – connect to backend API to fetch results.');
        }

        function clearFilters() {
            document.querySelectorAll('.filter-field input').forEach(function(el) {
                el.value = '';
            });
        }

        function handleRowClick(isExisting, gadId) {
            window.location = 'signer_details.html?reqid=DADREQ123456';
        }
    </script>
</body>
</html>
