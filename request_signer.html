<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAD - Request New Signer Form</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/sql-js/sql-wasm.js"></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Disbursement Authorization Database <span class="subtitle">– Signer Onboarding</span></h1>
        </div>

        <script src="js/navbar.js"></script>

        <!-- Section 1: Search Form -->
        <div class="panel panel--blue">
            <div class="panel-title">Section 1: Search Signer</div>
            <div class="filter-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                <div class="filter-field">
                    <label for="gadId">GAD ID</label>
                    <input type="text" id="gadId" placeholder="e.g. john.smith@manulife.com">
                </div>
                <div class="filter-field">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="First name">
                </div>
                <div class="filter-field">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Last name">
                </div>
                <div class="filter-field">
                    <label for="existingSigner">Existing Signer</label>
                    <select id="existingSigner">
                        <option value="">All</option>
                        <option>Y</option>
                        <option>N</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="doSearch()">Search</button>
                <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
            </div>
        </div>

        <!-- Section 2: Results Table -->
        <div class="panel panel--blue">
            <div class="panel-title">Section 2: Results</div>
            <p style="margin: 0 0 15px 0; font-style: italic; color: #555;">Click the row to request change</p>
            <div class="data-table-wrapper">
                <table class="data-table" id="resultsTable">
                    <thead>
                        <tr>
                            <th>GAD ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Existing Signer</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        var DB;
        var ALL_ROWS = [];

        (async function() {
            var SQL = await initSqlJs({ locateFile: function(f) { return 'js/sql-js/' + f; } });
            var buf = await fetch('db/data.db').then(function(r) { return r.arrayBuffer(); });
            DB = new SQL.Database(new Uint8Array(buf));

            var res = DB.exec(
                "SELECT u.gad_id, u.first_name, u.last_name, " +
                "CASE WHEN s.gad_id IS NOT NULL THEN 'Y' ELSE 'N' END AS existing_signer " +
                "FROM user_profile u " +
                "LEFT JOIN signer s ON u.gad_id = s.gad_id " +
                "ORDER BY u.last_name, u.first_name"
            );

            if (res.length) {
                ALL_ROWS = res[0].values.map(function(r) {
                    return { gadId: r[0] || '', firstName: r[1] || '', lastName: r[2] || '', existing: r[3] };
                });
            }
            renderRows(ALL_ROWS);
        })();

        function renderRows(rows) {
            var tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            rows.forEach(function(r) {
                var tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                tr.onclick = function() { handleRowClick(r.existing, r.gadId); };
                tr.innerHTML =
                    '<td>' + r.gadId + '</td>' +
                    '<td>' + r.firstName + '</td>' +
                    '<td>' + r.lastName + '</td>' +
                    '<td>' + r.existing + '</td>';
                tbody.appendChild(tr);
            });
        }

        var FILTER_COL_MAP = { gadId: 0, firstName: 1, lastName: 2, existingSigner: 3 };

        function highlightColumns() {
            document.querySelectorAll('#resultsTable th, #resultsTable td').forEach(function(cell) {
                cell.style.backgroundColor = '';
            });
            Object.keys(FILTER_COL_MAP).forEach(function(id) {
                var el = document.getElementById(id);
                if (!el || !el.value) return;
                var col = FILTER_COL_MAP[id];
                document.querySelectorAll('#resultsTable thead th')[col].style.backgroundColor = '#c8e6c9';
                document.querySelectorAll('#resultsTable tbody tr').forEach(function(tr) {
                    var td = tr.children[col];
                    if (td) td.style.backgroundColor = '#e8f5e9';
                });
            });
        }

        function doSearch() {
            var gadIdVal = document.getElementById('gadId').value.trim().toLowerCase();
            var firstName = document.getElementById('firstName').value.trim().toLowerCase();
            var lastName = document.getElementById('lastName').value.trim().toLowerCase();
            var existing = document.getElementById('existingSigner').value;

            var filtered = ALL_ROWS.filter(function(r) {
                if (gadIdVal && r.gadId.toLowerCase().indexOf(gadIdVal) === -1) return false;
                if (firstName && r.firstName.toLowerCase().indexOf(firstName) === -1) return false;
                if (lastName && r.lastName.toLowerCase().indexOf(lastName) === -1) return false;
                if (existing && r.existing !== existing) return false;
                return true;
            });
            renderRows(filtered);
            highlightColumns();
        }

        function clearFilters() {
            document.querySelectorAll('.filter-field input, .filter-field select').forEach(function(el) {
                el.value = '';
            });
            document.querySelectorAll('#resultsTable th, #resultsTable td').forEach(function(cell) {
                cell.style.backgroundColor = '';
            });
            renderRows(ALL_ROWS);
        }

        function handleRowClick(isExisting, gadId) {
            if (isExisting === 'Y') {
                window.location = 'signer_details.html?upn=' + encodeURIComponent(gadId);
            } else {
                window.location = 'signer_details.html?upn=' + encodeURIComponent(gadId) + '&action=update';
            }
        }

        document.querySelectorAll('.filter-field input, .filter-field select').forEach(function(el) {
            el.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
        });
    </script>
</body>
</html>
