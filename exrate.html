<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAD - Exchange Rates</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Disbursement Authorization Database <span class="subtitle">– Exchange Rates</span></h1>
        </div>

        <script src="js/navbar.js"></script>

        <div class="action-bar action-bar--blue">
            <span class="action-bar-label">Actions:</span>
            <button onclick="doSearch()">Search</button>
            <button onclick="location.reload()">Refresh</button>
            <button onclick="doExport()">Export</button>
            <button onclick="window.print()">Print</button>
            <a href="audit_exrate.html" class="action-bar-link">View Audit Log</a>
        </div>

        <div class="panel panel--blue" id="searchPanel" style="display:none;">
            <div class="panel-title">Search Exchange Rates</div>
            <div class="filter-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                <div class="filter-field">
                    <label for="fSrc">Source Currency</label>
                    <input type="text" id="fSrc" placeholder="e.g. USD">
                </div>
                <div class="filter-field">
                    <label for="fTgt">Target Currency</label>
                    <input type="text" id="fTgt" placeholder="e.g. CAD">
                </div>
                <div class="filter-field">
                    <label for="fRate">Plan Rate (max)</label>
                    <input type="number" id="fRate" placeholder="e.g. 2.0" step="0.0001" min="0">
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="filterTable()">Apply Filter</button>
                <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
            </div>
        </div>

        <div class="panel panel--blue">
            <div class="panel-title">Exchange Rates</div>
            <div class="data-table-wrapper">
                <table class="data-table" id="resultsTable">
                    <thead>
                        <tr>
                            <th>Source Currency</th>
                            <th>Target Currency</th>
                            <th>Plan Rate</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <tr><td>USD</td><td>CAD</td><td>1.3600</td></tr>
                        <tr><td>USD</td><td>HKD</td><td>7.8200</td></tr>
                        <tr><td>USD</td><td>SGD</td><td>1.3400</td></tr>
                        <tr><td>USD</td><td>AUD</td><td>1.5500</td></tr>
                        <tr><td>USD</td><td>JPY</td><td>149.5000</td></tr>
                        <tr><td>USD</td><td>GBP</td><td>0.7900</td></tr>
                        <tr><td>USD</td><td>EUR</td><td>0.9200</td></tr>
                        <tr><td>CAD</td><td>USD</td><td>0.7350</td></tr>
                        <tr><td>HKD</td><td>USD</td><td>0.1279</td></tr>
                        <tr><td>GBP</td><td>USD</td><td>1.2658</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function doSearch() {
            var panel = document.getElementById('searchPanel');
            panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
        }
        function filterTable() {
            var src  = document.getElementById('fSrc').value.trim().toLowerCase();
            var tgt  = document.getElementById('fTgt').value.trim().toLowerCase();
            var rate = document.getElementById('fRate').value.trim();
            document.querySelectorAll('#resultsBody tr').forEach(function(row) {
                var cells = row.querySelectorAll('td');
                var rowRate = parseFloat(cells[2].textContent.trim());
                var match = (!src  || cells[0].textContent.trim().toLowerCase().includes(src))
                         && (!tgt  || cells[1].textContent.trim().toLowerCase().includes(tgt))
                         && (!rate || rowRate <= parseFloat(rate));
                row.style.display = match ? '' : 'none';
            });
        }
        function clearFilters() {
            document.getElementById('fSrc').value = '';
            document.getElementById('fTgt').value = '';
            document.getElementById('fRate').value = '';
            document.querySelectorAll('#resultsBody tr').forEach(function(r) { r.style.display = ''; });
        }
        function doExport() { alert('Export triggered – connect to backend API.'); }
    </script>
</body>
</html>
