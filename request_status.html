<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAD - Signer Request Status</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Disbursement Authorization Database <span class="subtitle">– Signer Request Status</span></h1>
        </div>

        <script src="js/sql-js/sql-wasm.js"></script>
        <script src="js/dadreq_data.js"></script>
        <script src="js/navbar.js"></script>

        <!-- Action Bar -->
        <div class="action-bar action-bar--blue">
            <span class="action-bar-label">Actions:</span>
            <button onclick="doSearch()">Search</button>
            <button onclick="location.reload()">Refresh</button>
            <button onclick="doExport()">Export</button>
            <button onclick="window.print()">Print</button>
        </div>

        <!-- Section 1: Search Filters -->
        <div class="panel panel--blue" id="searchPanel" style="display:none;">
            <div class="panel-title">Section 1: Search Request</div>
            <div class="filter-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                <div class="filter-field">
                    <label for="requestId">Request ID</label>
                    <input type="text" id="requestId" placeholder="e.g. DADREQ123456">
                </div>
                <div class="filter-field">
                    <label for="dateSubmitted">Date Submitted</label>
                    <input type="date" id="dateSubmitted">
                </div>
                <div class="filter-field">
                    <label for="submittedBy">Submitted By</label>
                    <input type="text" id="submittedBy" placeholder="Submitter name or GAD ID">
                </div>
                <div class="filter-field">
                    <label for="submittedFor">Submitted For</label>
                    <input type="text" id="submittedFor" placeholder="Signer name or GAD ID">
                </div>
                <div class="filter-field">
                    <label for="requestStatus">Request Status</label>
                    <select id="requestStatus">
                        <option value="">-- All --</option>
                        <option value="Open">Open</option>
                        <option value="Complete">Complete</option>
                        <option value="Reject">Reject</option>
                        <option value="Cancel">Cancel</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="filterTable()">Apply Filter</button>
                <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
            </div>
        </div>

        <!-- Section 2: Results -->
        <div class="panel panel--blue">
            <div class="panel-title">Signer Request in the past 90 days</div>
            <div class="data-table-wrapper">
                <table class="data-table" id="resultsTable">
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Date Submitted</th>
                            <th>Submitted By</th>
                            <th>Submitted For</th>
                            <th>Request Status</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Auto-highlight row if URL has highlight param
        var params = new URLSearchParams(window.location.search);
        var highlight = params.get('highlight') || '';
        if (highlight) {
            document.querySelectorAll('#resultsBody tr').forEach(function(row) {
                if (row.textContent.indexOf(highlight) !== -1) {
                    row.style.backgroundColor = '#fffbe6';
                    row.style.outline = '2px solid #f0c040';
                }
            });
        }

        function doSearch() {
            var panel = document.getElementById('searchPanel');
            panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
        }

        // Load DADREQ rows from db/dadreq.db via sql.js
        window.DADREQ_READY.then(function() {
            var list = window.DADREQ_LIST || [];
            var statusClasses = { Open: 'status-open', Complete: 'status-complete', Reject: 'status-reject', Cancel: 'status-cancel' };
            var tbody = document.getElementById('resultsBody');
            list.forEach(function(item) {
                var tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                tr.setAttribute('onclick', "handleRowClick('" + item.reqId + "')");
                tr.innerHTML =
                    '<td>' + item.reqId + '</td>' +
                    '<td>' + item.date + '</td>' +
                    '<td>' + item.submitter + '</td>' +
                    '<td>' + item.submittedFor + '</td>' +
                    '<td><span class="status-badge ' + statusClasses[item.status] + '">' + item.status + '</span></td>';
                tbody.appendChild(tr);
            });
        });

        function filterTable() {
            var reqId     = document.getElementById('requestId').value.trim().toLowerCase();
            var dateSub   = document.getElementById('dateSubmitted').value;
            var subBy     = document.getElementById('submittedBy').value.trim().toLowerCase();
            var subFor    = document.getElementById('submittedFor').value.trim().toLowerCase();
            var status    = document.getElementById('requestStatus').value.toLowerCase();

            document.querySelectorAll('#resultsBody tr').forEach(function(row) {
                var cells = row.querySelectorAll('td');
                var rowReqId  = cells[0].textContent.trim().toLowerCase();
                var rowDate   = cells[1].textContent.trim();
                var rowSubBy  = cells[2].textContent.trim().toLowerCase();
                var rowSubFor = cells[3].textContent.trim().toLowerCase();
                var rowStatus = cells[4].textContent.trim().toLowerCase();

                var match = (!reqId  || rowReqId.includes(reqId))
                         && (!dateSub || rowDate === dateSub)
                         && (!subBy  || rowSubBy.includes(subBy))
                         && (!subFor || rowSubFor.includes(subFor))
                         && (!status || rowStatus.includes(status));

                row.style.display = match ? '' : 'none';
            });
        }

        function clearFilters() {
            document.getElementById('requestId').value = '';
            document.getElementById('dateSubmitted').value = '';
            document.getElementById('submittedBy').value = '';
            document.getElementById('submittedFor').value = '';
            document.getElementById('requestStatus').value = '';
            // Reset all rows to visible
            document.querySelectorAll('#resultsBody tr').forEach(function(row) {
                row.style.display = '';
            });
        }

        function handleRowClick(dadReqId) {
            window.location = 'signer_details.html?reqid=' + encodeURIComponent(dadReqId);
        }

        function doExport() {
            alert('Export triggered – connect to backend API.');
        }
    </script>

    <style>
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .status-open    { background: #dbeafe; color: #1e40af; }
        .status-complete { background: #dcfce7; color: #166534; }
        .status-reject  { background: #fee2e2; color: #991b1b; }
        .status-cancel  { background: #f3f4f6; color: #4b5563; }
    </style>
</body>
</html>
